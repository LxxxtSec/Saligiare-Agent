name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装项目
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 运行测试
        run: python -m pytest -q

      - name: 运行代码检查
        run: python -m ruff check .